name: Rename release assets

# Renames release files rustdesk-* -> OnlineDeskTop-*.
# The build itself keeps the upstream file names (other jobs depend on them);
# this runs after publishing. Can also be started manually for any release tag.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        type: string
        default: 'nightly'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Rename assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          rel=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)
          assets=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$rel/assets?per_page=100" --jq '.[] | "\(.id)\t\(.name)"')
          while IFS=$'\t' read -r id name; do
            case "$name" in
              rustdesk*) ;;
              *) continue ;;
            esac
            new="OnlineDeskTop${name#rustdesk}"
            # a rebuild of the same tag re-uploads rustdesk-*; drop the stale renamed copy first
            old_id=$(printf '%s\n' "$assets" | awk -F'\t' -v n="$new" '$2==n {print $1}')
            if [ -n "$old_id" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old_id"
            fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" -f name="$new" --jq .name
          done <<< "$assets"
