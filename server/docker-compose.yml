# OnlineDeskTop server: hbbs (ID / rendezvous) + hbbr (relay).
# Ports: 21115/tcp, 21116/tcp+udp, 21117/tcp (21118-21119/tcp only for the web client).
services:
  hbbs:
    container_name: odt-hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes:
      - ./data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: odt-hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: host
    restart: unless-stopped
